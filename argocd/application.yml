apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: skillpulse-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Rohini-996/Skillpulse-Project1.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: skillpulse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
